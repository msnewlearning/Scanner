<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F6F9">
<title>Chart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #F4F6F9; --border: #D5DCE5; --text: #1A2230; --text-dim: #566274; --accent: #13866E; --weak: #C0392B; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans', -apple-system, sans-serif; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 16px; border-bottom: 1px solid var(--border); flex: none; flex-wrap: wrap; }
  .back { font-size: 13px; color: var(--text-dim); text-decoration: none; }
  .back:hover { color: var(--accent); }
  h1 { font-size: 18px; margin: 0; }
  .note { font-size: 11.5px; color: var(--text-dim); }
  .widget-wrap { flex: 1 1 auto; min-height: 0; }
  .tradingview-widget-container, .tradingview-widget-container__widget { height: 100%; width: 100%; }
  .status { text-align: center; padding: 60px 20px; color: var(--weak); font-size: 14px; }
</style>
</head>
<body>
  <div class="topbar">
    <div>
      <a class="back" href="javascript:window.close()">&larr; Close</a>
      <h1 id="title">Loading&hellip;</h1>
    </div>
    <div class="note">Chart &amp; indicators via TradingView</div>
  </div>
  <div id="widget-area" class="widget-wrap"></div>

<script>
(function() {
  const params = new URLSearchParams(location.search);
  const symbol = (params.get('symbol') || '').trim().toUpperCase();
  const titleEl = document.getElementById('title');
  const area = document.getElementById('widget-area');

  if (!symbol) {
    titleEl.textContent = 'No symbol';
    area.innerHTML = '<div class="status">No symbol given. Open this page as chart.html?symbol=SYMBOL.</div>';
    return;
  }

  titleEl.textContent = symbol;
  document.title = symbol + ' chart';

  area.innerHTML =
    '<div class="tradingview-widget-container">' +
      '<div id="tv_chart_container" class="tradingview-widget-container__widget"></div>' +
    '</div>';

  const script = document.createElement('script');
  script.src = 'https://s3.tradingview.com/tv.js';
  script.onload = function() {
    new TradingView.widget({
      autosize: true,
      symbol: 'NSE:' + symbol,
      interval: 'D',
      timezone: 'Asia/Kolkata',
      theme: 'light',
      style: '0',
      locale: 'en',
      toolbar_bg: '#F4F6F9',
      enable_publishing: false,
      allow_symbol_change: true,
      hide_side_toolbar: false,
      overrides: {
        'paneProperties.vertGridProperties.color': 'rgba(0,0,0,0)',
        'paneProperties.horzGridProperties.color': 'rgba(0,0,0,0)'
      },
      studies: [
        { id: 'MAExp@tv-basicstudies', inputs: { length: 10 } },
        { id: 'MAExp@tv-basicstudies', inputs: { length: 20 } },
        { id: 'MAExp@tv-basicstudies', inputs: { length: 50 } },
        { id: 'RSI@tv-basicstudies' }
      ],
      container_id: 'tv_chart_container'
    });
  };
  script.onerror = function() {
    area.innerHTML = '<div class="status">Could not load the TradingView widget script. Check your internet connection and try again.</div>';
  };
  document.body.appendChild(script);
})();
</script>
</body>
</html>
