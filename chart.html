<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NSE Stock Chart</title>
  <style>
    :root {
      color-scheme: light;
      --page-bg: #ffffff;
      --text: #182230;
      --muted: #667085;
      --border: #e5e7eb;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--page-bg); color: var(--text); }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .page { max-width: 1600px; margin: 0 auto; padding: 14px 16px 18px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .heading { min-width: 0; }
    .back { color: var(--muted); text-decoration: none; font-size: 12px; }
    h1 { font-size: 20px; line-height: 1.25; margin: 5px 0 0; font-weight: 650; }
    .subtitle { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .chart-card { height: calc(100vh - 105px); min-height: 520px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: #fff; }
    #tv_chart { width: 100%; height: 100%; }
    @media (max-width: 600px) {
      .page { padding: 10px 8px; }
      h1 { font-size: 17px; }
      .chart-card { height: calc(100vh - 100px); min-height: 480px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="heading">
        <a class="back" href="javascript:window.close()">← Close chart</a>
        <h1 id="symbol-title">NSE Stock Chart</h1>
        <div class="subtitle">Bar chart · EMA 10 / 21 / 50 · TradingView</div>
      </div>
    </header>
    <div class="chart-card">
      <div id="tv_chart"></div>
    </div>
  </main>

  <script src="https://s3.tradingview.com/tv.js"></script>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      let symbol = (params.get("symbol") || "NIFTY").trim().toUpperCase();
      // Accept either RELIANCE or NSE:RELIANCE in the query string.
      if (!symbol.includes(":")) symbol = "NSE:" + symbol;
      document.getElementById("symbol-title").textContent = symbol.replace(/^NSE:/, "") + " Chart";
      document.title = symbol.replace(/^NSE:/, "") + " Chart";

      new TradingView.widget({
        autosize: true,
        symbol: symbol,
        interval: "D",
        timezone: "Asia/Kolkata",
        theme: "Light",
        style: "1",
        locale: "en",
        enable_publishing: false,
        allow_symbol_change: true,
        hide_top_toolbar: false,
        hide_legend: false,
        save_image: false,
        container_id: "tv_chart",
        backgroundColor: "#ffffff",
        gridColor: "#f0f2f5",
        studies: [
          { id: "MAExp@tv-basicstudies", inputs: { length: 10 } },
          { id: "MAExp@tv-basicstudies", inputs: { length: 21 } },
          { id: "MAExp@tv-basicstudies", inputs: { length: 50 } }
        ],
        overrides: {
          "paneProperties.background": "#ffffff",
          "paneProperties.backgroundType": "solid",
          "paneProperties.vertGridProperties.color": "#f0f2f5",
          "paneProperties.horzGridProperties.color": "#f0f2f5",
          "scalesProperties.textColor": "#475467",
          "mainSeriesProperties.barStyle.upColor": "#089981",
          "mainSeriesProperties.barStyle.downColor": "#F23645",
          "mainSeriesProperties.barStyle.barColorsOnPrevClose": false
        },
        studies_overrides: {
          "moving average exponential.plot.color": "#2962FF",
          "moving average exponential.plot.linewidth": 2
        }
      });
    })();
  </script>
</body>
</html>
